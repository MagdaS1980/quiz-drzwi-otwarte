<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miniquiz</title>
<style>
body{font-family:Arial,sans-serif;max-width:800px;margin:20px auto;padding:20px}
.question{margin:15px 0;padding:12px;border:1px solid #ddd;border-radius:8px}
button{padding:10px 16px}
</style>
</head>
<body>
<h1>Miniquiz „Jakim jesteś odkrywcą wiedzy?”</h1>
<form id="quiz">
<div class="question"><p>1. Gdy dostajesz nowe zadanie:</p>
<label><input type="radio" name="q1" value="A"> Analizuję problem</label><br>
<label><input type="radio" name="q1" value="B"> Wymyślam pomysły</label><br>
<label><input type="radio" name="q1" value="C"> Współpracuję z innymi</label><br>
<label><input type="radio" name="q1" value="D"> Działam od razu</label></div>

<div class="question"><p>2. Najciekawsze zajęcie:</p>
<label><input type="radio" name="q2" value="A"> Zagadki i eksperymenty</label><br>
<label><input type="radio" name="q2" value="B"> Tworzenie</label><br>
<label><input type="radio" name="q2" value="C"> Organizowanie wydarzeń</label><br>
<label><input type="radio" name="q2" value="D"> Budowanie i projektowanie</label></div>

<div class="question"><p>3. Na projekcie:</p>
<label><input type="radio" name="q3" value="A"> Analizuję informacje</label><br>
<label><input type="radio" name="q3" value="B"> Dbam o kreatywność</label><br>
<label><input type="radio" name="q3" value="C"> Koordynuję zespół</label><br>
<label><input type="radio" name="q3" value="D"> Wykonuję zadania praktyczne</label></div>

<div class="question"><p>4. Motywuje mnie:</p>
<label><input type="radio" name="q4" value="A"> Zrozumienie świata</label><br>
<label><input type="radio" name="q4" value="B"> Wyrażanie siebie</label><br>
<label><input type="radio" name="q4" value="C"> Wspólny cel</label><br>
<label><input type="radio" name="q4" value="D"> Widoczne efekty</label></div>

<div class="question"><p>5. W wolnym czasie:</p>
<label><input type="radio" name="q5" value="A"> Odkrywam ciekawostki</label><br>
<label><input type="radio" name="q5" value="B"> Tworzę</label><br>
<label><input type="radio" name="q5" value="C"> Spotykam się z ludźmi</label><br>
<label><input type="radio" name="q5" value="D"> Działam aktywnie</label></div>

<div class="question"><p>6. Najlepiej mnie opisuje:</p>
<label><input type="radio" name="q6" value="A"> Lubię dociekać</label><br>
<label><input type="radio" name="q6" value="B"> Mam wiele pomysłów</label><br>
<label><input type="radio" name="q6" value="C"> Dobrze pracuję w grupie</label><br>
<label><input type="radio" name="q6" value="D"> Uczę się przez działanie</label></div>

<button type="button" onclick="showResult()">Zobacz wynik</button>
</form>

<div id="result"></div>

<script>
function showResult(){
 let c={A:0,B:0,C:0,D:0};
 for(let i=1;i<=6;i++){
  let a=document.querySelector('input[name=q'+i+']:checked');
  if(!a){alert('Odpowiedz na wszystkie pytania'); return;}
  c[a.value]++;
 }
 let best='A';
 ['B','C','D'].forEach(k=>{if(c[k]>c[best]) best=k;});
 const txt={
 A:'🔍 Odkrywca – lubisz analizować, badać i rozwiązywać problemy.',
 B:'🎨 Twórca – cenisz kreatywność i nowe pomysły.',
 C:'🤝 Lider współpracy – dobrze czujesz się w pracy z ludźmi.',
 D:'⚙️ Praktyk – lubisz konkretne działania i rezultaty.'
 };
 document.getElementById('result').innerHTML='<h2>Twój wynik</h2><p>'+txt[best]+'</p>';
}
</script>
</body>
</html>
